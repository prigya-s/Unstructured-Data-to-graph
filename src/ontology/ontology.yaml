# =====================================================================
# Enterprise Knowledge Graph Ontology
#
# entity_types:  each type carries a list of "keywords". A candidate
#   noun phrase extracted from text is classified as that type when
#   its final token matches one of the keywords (case-insensitive).
#
# technology_gazetteer: known technology / platform names that are
#   classified as Technology regardless of suffix (e.g. "Kubernetes",
#   "PostgreSQL"). Matched as whole, case-insensitive tokens/phrases.
#
# relationship_types: each type carries a list of natural-language
#   "triggers" used to detect that relationship between two entities
#   mentioned in the same sentence.
#
# domain/range (optional, entity type names; range may be a list): FIBO-
#   style constraint on which entity types a relationship may connect,
#   emitted as rdfs:domain/rdfs:range by build_core_ontology.py and
#   checked advisory-only (never blocking) by
#   ontology.rdf.guardrails.check_relationship_type_mismatch - see
#   docs/architecture/owl_turtle_ontology.md. Only declared where the
#   relationship genuinely implies fixed types; absence means
#   "unconstrained," not "invalid."
# =====================================================================

entity_types:
  Document:
    keywords: []

  Application:
    keywords:
      - application
      - app
      - portal
      - platform

  System:
    keywords:
      - system

  Service:
    keywords:
      - service
      - microservice

  Database:
    keywords:
      - database
      - db
      - datastore
      - store

  API:
    keywords:
      - api
      - endpoint
      - gateway

  Process:
    keywords:
      - process
      - workflow
      - pipeline

  Team:
    keywords:
      - team
      - squad
      - department

  Technology:
    keywords:
      - framework
      - language
      - protocol

  Policy:
    keywords:
      - policy
      - standard
      - guideline
      - compliance

  # ---------------------------------------------------------------------
  # DRAFT - added for the MYDET (Change of Address SOP) corpus, pending
  # subject-matter review. First-pass keyword guesses only, not validated
  # against the full corpus by a domain expert.
  #
  # Caveat: entity_extractor._PHRASE_RE only matches sequences of tokens
  # that each start with an uppercase letter, with no lowercase glue word
  # in between. Practical consequences for this corpus:
  #   - lowercase-leading terms ("iForm", "iForms") can never be extracted
  #     as a candidate at all - these keywords will not fire on them.
  #   - a lowercase word breaks a multi-word phrase, so "Change of Address"
  #     extracts as two separate single-word candidates ("Change",
  #     "Address"), never as one "Change of Address" entity.
  #   - hyphenated compounds ("Account-Managing Adult") also split at the
  #     hyphen.
  # None of the above can be fixed by a keywords-only change; they would
  # require changing the extraction regex, which is out of scope here.
  # ---------------------------------------------------------------------
  Role:
    keywords:
      - adult          # "Managing Adult"
      - holder          # "Account Holder"
      - customer

  Product:
    keywords:
      - isa             # "ISA"
      - jisa            # "JISA"
      - ctf             # "CTF"
      - account         # "Savings Account"

  ExternalPartner:
    keywords:
      - mail            # "Royal Mail"
      - office          # "Post Office"

  Tool:
    keywords:
      - finder          # "Postal Address Finder"

  Check:
    keywords:
      - authentication
      - verification
      - check

  Party:
    keywords:
      - contact
      - beneficiary
      - donor

  Channel:
    keywords:
      - ivr
      - branch
      - telephony

technology_gazetteer:
  - Kubernetes
  - Docker
  - PostgreSQL
  - MySQL
  - MongoDB
  - Redis
  - Kafka
  - Java
  - Python
  - Node.js
  - React
  - GraphQL
  - gRPC
  - AWS
  - Azure
  - GCP
  - OAuth2
  - TensorFlow
  - Terraform
  - Linux

# domain_gazetteer: known domain-specific acronyms/short-forms that don't
# reliably classify by suffix keyword (e.g. bare acronyms like "IVR" have
# no keyword suffix to match against). Unlike technology_gazetteer (which
# is a flat list always typed "Technology"), each entry here maps directly
# to its correct entity type.
domain_gazetteer:
  IVR: Channel
  CAT: Check
  SAMM: System
  COA: Process
  FATCA: Policy
  DIP: Product
  TMW: ExternalPartner
  CCBS: ExternalPartner

relationship_types:
  USES:
    triggers:
      - uses
      - utilizes
      - leverages
      - relies on

  DEPENDS_ON:
    triggers:
      - depends on
      - is dependent on
      - requires

  CONNECTS_TO:
    triggers:
      - connects to
      - integrates with
      - communicates with

  OWNS:
    domain: Team
    range: [System, Service, Application]
    triggers:
      - owns
      - is responsible for
      - maintains

  CONTAINS:
    triggers:
      - contains
      - includes
      - comprises

  IMPLEMENTS:
    triggers:
      - implements
      - adheres to
      - follows

  REFERENCES:
    triggers:
      - references
      - refers to
      - cites

  # DRAFT - added for the MYDET corpus, pending subject-matter review.
  REFERS_TO:
    triggers:
      - refer to
      - refer them to
      - redirect to
      - redirected to

  ESCALATES_TO:
    domain: Channel
    range: Team
    triggers:
      - escalate to
      - escalated to
      - hand over to
      - handover to
      - transfer to

  REQUIRES:
    triggers:
      - must
      - need to
      - needs to

  APPLIES_TO:
    triggers:
      - applies to
      - for accounts with
      - for customers with
